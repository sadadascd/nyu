<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Arcade Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE BLOQUEIO / DESBLOQUEIO -->
  <div id="gatekeeper" class="gatekeeper-screen">
    <div class="glass-card gatekeeper-card">
      <div class="lock-icon">🔒</div>
      <h1 class="glow-title">Acesso Restrito</h1>
      <p class="subtitle">Complete a sequência de memória para liberar o Arcade Hub</p>

      <div class="simon-container">
        <div class="simon-btn red" data-color="0"></div>
        <div class="simon-btn blue" data-color="1"></div>
        <div class="simon-btn green" data-color="2"></div>
        <div class="simon-btn yellow" data-color="3"></div>
      </div>

      <p id="simon-status" class="status-msg">Clique em Iniciar Desafio</p>
      <button id="btn-start-simon" class="neon-btn red-neon">Iniciar Desafio</button>
    </div>
  </div>

  <!-- PORTAL PRINCIPAL (ARCADE) -->
  <div id="arcade-portal" class="arcade-screen hidden">
    <header class="navbar">
      <div class="logo">⚡ CYBER ARCADE</div>
      <div class="score-badge">Pontos Globais: <span id="global-score">0</span></div>
    </header>

    <main class="main-container">
      <nav class="game-tabs">
        <button id="tab-snake" class="tab-btn active">🐍 Jogo da Cobrinha</button>
        <button id="tab-shooter" class="tab-btn">🎯 Tiro ao Alvo</button>
      </nav>

      <!-- SEÇÃO COBRINHA -->
      <section id="section-snake" class="game-section">
        <div class="game-header">
          <h2>Cyber Snake</h2>
          <div class="game-info">Pontos: <span id="snake-score">0</span></div>
        </div>
        
        <div class="canvas-wrapper">
          <canvas id="snake-canvas" width="400" height="400"></canvas>
          <div id="snake-overlay" class="overlay">
            <button id="btn-play-snake" class="neon-btn green-neon">Jogar Snake</button>
          </div>
        </div>

        <!-- Controles Mobile -->
        <div class="dpad">
          <button class="dpad-btn up" id="btn-up">▲</button>
          <button class="dpad-btn left" id="btn-left">◄</button>
          <button class="dpad-btn right" id="btn-right">►</button>
          <button class="dpad-btn down" id="btn-down">▼</button>
        </div>
      </section>

      <!-- SEÇÃO TIRO AO ALVO -->
      <section id="section-shooter" class="game-section hidden">
        <div class="game-header">
          <h2>Tiro ao Alvo Holográfico</h2>
          <div class="game-info">
            <span>Tempo: <span id="shooter-timer">30</span>s</span> | 
            <span>Pontos: <span id="shooter-score">0</span></span>
          </div>
        </div>
        
        <div class="canvas-wrapper">
          <canvas id="shooter-canvas" width="400" height="400"></canvas>
          <div id="shooter-overlay" class="overlay">
            <button id="btn-play-shooter" class="neon-btn red-neon">Iniciar Partida</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
