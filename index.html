<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Arcade Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE SEGURANÇA / TERMINAL DE HACKING -->
  <div id="gatekeeper" class="gatekeeper-screen">
    <div class="glass-card gatekeeper-card fade-in">
      <div class="lock-icon pulse-icon">⚡</div>
      <h1 class="glow-title">TERMINAL CYBER</h1>
      <p class="subtitle">SISTEMA BLOQUEADO. DECODIFIQUE O ACESSO.</p>

      <div class="terminal-box">
        <p id="terminal-text">> Aguardando credenciais...</p>
      </div>

      <div class="input-group">
        <input type="password" id="pass-input" placeholder="Digite a senha (ou clique em Decodificar)">
      </div>

      <div style="margin-top: 15px;">
        <button id="btn-hack" class="neon-btn green-neon btn-glow">Decodificar Acesso</button>
      </div>
    </div>
  </div>

  <!-- PORTAL PRINCIPAL (ARCADE) -->
  <div id="arcade-portal" class="arcade-screen hidden">
    <header class="navbar">
      <div class="logo">⚡ CYBER ARCADE</div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="btn-audio-toggle" class="audio-btn">🔊 Som: ON</button>
        <div class="score-badge">Pontos: <span id="global-score">0</span></div>
      </div>
    </header>

    <main class="main-container">
      <nav class="game-tabs">
        <button id="tab-snake" class="tab-btn active">🐍 Cobrinha</button>
        <button id="tab-shooter" class="tab-btn">🎯 Tiro ao Alvo</button>
        <button id="tab-breakout" class="tab-btn">🧱 Breakout</button>
        <button id="tab-flappy" class="tab-btn">🛸 Flappy Cyber</button>
      </nav>

      <!-- COBRINHA -->
      <section id="section-snake" class="game-section slide-up">
        <div class="game-header">
          <h2>Cyber Snake</h2>
          <div class="game-info">
            <span>Score: <span id="snake-score">0</span></span> | 
            <span>Recorde: <span id="snake-high">0</span></span>
          </div>
        </div>
        
        <div id="wrapper-snake" class="canvas-wrapper">
          <canvas id="snake-canvas" width="400" height="400"></canvas>
          <div id="snake-overlay" class="overlay">
            <button id="btn-play-snake" class="neon-btn green-neon btn-glow">Jogar Snake</button>
          </div>
        </div>

        <div class="dpad">
          <button class="dpad-btn up" id="btn-up">▲</button>
          <button class="dpad-btn left" id="btn-left">◄</button>
          <button class="dpad-btn right" id="btn-right">►</button>
          <button class="dpad-btn down" id="btn-down">▼</button>
        </div>
      </section>

      <!-- TIRO AO ALVO -->
      <section id="section-shooter" class="game-section hidden">
        <div class="game-header">
          <h2>Tiro ao Alvo</h2>
          <div class="game-info">
            <span>Tempo: <span id="shooter-timer">30</span>s</span> | 
            <span>Score: <span id="shooter-score">0</span></span> | 
            <span>Recorde: <span id="shooter-high">0</span></span>
          </div>
        </div>
        
        <div id="wrapper-shooter" class="canvas-wrapper">
          <canvas id="shooter-canvas" width="400" height="400"></canvas>
          <div id="shooter-overlay" class="overlay">
            <button id="btn-play-shooter" class="neon-btn red-neon btn-glow">Iniciar Partida</button>
          </div>
        </div>
      </section>

      <!-- BREAKOUT -->
      <section id="section-breakout" class="game-section hidden">
        <div class="game-header">
          <h2>Breakout Neon</h2>
          <div class="game-info">
            <span>Vidas: <span id="breakout-lives">3</span></span> | 
            <span>Score: <span id="breakout-score">0</span></span> | 
            <span>Recorde: <span id="breakout-high">0</span></span>
          </div>
        </div>
        
        <div id="wrapper-breakout" class="canvas-wrapper">
          <canvas id="breakout-canvas" width="400" height="400"></canvas>
          <div id="breakout-overlay" class="overlay">
            <button id="btn-play-breakout" class="neon-btn blue-neon btn-glow">Jogar Breakout</button>
          </div>
        </div>
      </section>

      <!-- FLAPPY CYBER (NOVO JOGO) -->
      <section id="section-flappy" class="game-section hidden">
        <div class="game-header">
          <h2>Flappy Cyber</h2>
          <div class="game-info">
            <span>Score: <span id="flappy-score">0</span></span> | 
            <span>Recorde: <span id="flappy-high">0</span></span>
          </div>
        </div>
        
        <div id="wrapper-flappy" class="canvas-wrapper">
          <canvas id="flappy-canvas" width="400" height="400"></canvas>
          <div id="flappy-overlay" class="overlay">
            <button id="btn-play-flappy" class="neon-btn yellow-neon btn-glow">Iniciar Flappy</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
